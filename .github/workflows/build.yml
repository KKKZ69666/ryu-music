name: RYU Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RYU APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Check Project
        run: |
          echo "Checking RYU project..."
          test -f pubspec.yaml
          test -f android/settings.gradle.kts
          test -f lib/main.dart
          echo "Project structure OK"

      - name: Prepare Gradle
        run: |
          chmod +x android/gradlew
          echo "Gradle permissions ready"

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze --no-fatal-infos

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi
          mkdir -p output
          cp "$APK" output/RYU-release.apk
          ls -lh output/RYU-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RYU-Android-APK
          path: output/RYU-release.apk
          if-no-files-found: error
          retention-days: 14

