name: RYU Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RYU APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Extract RYU Project
        run: |
          set -e

          test -f ryu.zip
          mkdir -p extracted
          unzip -o ryu.zip -d extracted

          PROJECT_DIR=$(find extracted \
            -name pubspec.yaml \
            -not -path '*/.dart_tool/*' \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan: $PROJECT_DIR"

      - name: Validate Project Files
        run: |
          set -e

          echo "=== PROJECT STRUCTURE ==="
          ls -la "$PROJECT_DIR"

          echo "=== CHECK FILES ==="

          for file in \
            pubspec.yaml \
            lib/main.dart \
            android/gradlew \
            android/gradle/wrapper/gradle-wrapper.properties
          do
            if [ ! -f "$PROJECT_DIR/$file" ]; then
              echo "ERROR: File tidak ditemukan: $file"
              exit 1
            fi
            echo "[OK] $file"
          done

      - name: Repair Gradle Wrapper
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -s android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle Wrapper JAR hilang. Membuat pengganti..."

            rm -rf /tmp/ryu_gradle_wrapper

            flutter create \
              --platforms=android \
              --project-name=ryu_gradle_wrapper \
              /tmp/ryu_gradle_wrapper

            mkdir -p android/gradle/wrapper

            cp /tmp/ryu_gradle_wrapper/android/gradle/wrapper/gradle-wrapper.jar \
              android/gradle/wrapper/gradle-wrapper.jar
          fi

          test -s android/gradle/wrapper/gradle-wrapper.jar

          chmod +x android/gradlew

          cd android
          ./gradlew --version

      - name: Clean and Install Dependencies
        run: |
          set -e
          cd "$PROJECT_DIR"

          flutter clean
          flutter pub get

      - name: Analyze Code
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos

      - name: Run Tests
        run: |
          cd "$PROJECT_DIR"
          flutter test

      - name: Build Release APK
        run: |
          set -e
          cd "$PROJECT_DIR"

          flutter build apk --release

          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare APK Artifact
        run: |
          set -e

          cp "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk" \
            RYU-RELEASE.apk

          ls -lh RYU-RELEASE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RYU-RELEASE
          path: RYU-RELEASE.apk
          if-no-files-found: error
          retention-days: 30
