
name: RYU Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RYU APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Extract RYU ZIP
        run: |
          set -e
          mkdir -p extracted
          unzip -o ryu.zip -d extracted

          PROJECT_DIR=$(find extracted -name pubspec.yaml \
            -not -path '*/.dart_tool/*' \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Inspect Project
        run: |
          set -e
          echo "Checking Flutter files..."
          test -f "$PROJECT_DIR/pubspec.yaml"
          test -f "$PROJECT_DIR/lib/main.dart"
          test -d "$PROJECT_DIR/android"

          echo "Android directory:"
          find "$PROJECT_DIR/android" -maxdepth 3 -type f | sort

      - name: Prepare Gradle Wrapper
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -f android/gradlew ]; then
            echo "Gradle wrapper script missing."
            echo "Checking wrapper files..."

            if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ] || \
               [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
              echo "ERROR: Gradle wrapper files are incomplete."
              exit 1
            fi

            echo "Cannot safely generate gradlew without a valid wrapper script."
            exit 1
          fi

          chmod +x android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Analyze Code
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos

      - name: Run Tests
        run: |
          cd "$PROJECT_DIR"
          flutter test

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RYU-Android-APK
          path: extracted/**/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
