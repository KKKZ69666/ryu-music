name: Build RYU APK

on:
  workflow_dispatch:
  push:
    branches:
      - ryu-final

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Select ZIP
        run: |
          if [ ! -f RYU-FINAL.zip ]; then
            echo "RYU-FINAL.zip tidak ditemukan!"
            exit 1
          fi
          unzip -t RYU-FINAL.zip

      - name: Extract Project
        run: |
          mkdir -p extracted
          unzip -q RYU-FINAL.zip -d extracted
          PROJECT_DIR=$(find extracted -name pubspec.yaml -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "pubspec.yaml tidak ditemukan!"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Analyze
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos

      - name: Test
        run: |
          cd "$PROJECT_DIR"
          flutter test

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RYU-Music-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
