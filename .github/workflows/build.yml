
name: RYU Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RYU Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ryu

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Check Project Structure
        run: |
          echo "Checking RYU project..."
          test -f pubspec.yaml || {
            echo "ERROR: pubspec.yaml not found!"
            exit 1
          }
          test -f android/settings.gradle.kts
          echo "Project structure OK"

      - name: Prepare Gradle Wrapper
        run: |
          chmod +x android/gradlew
          echo "Gradle wrapper permission configured"

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          mkdir -p output
          cp "$APK" output/RYU-release.apk
          ls -lh output/RYU-release.apk

      - name: Upload RYU APK
        uses: actions/upload-artifact@v4
        with:
          name: RYU-Android-APK
          path: ryu/output/RYU-release.apk
          if-no-files-found: error
          retention-days: 14
