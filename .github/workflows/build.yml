name: Build RYU APK

on:
  push:
    branches:
      - ryu-online-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RYU APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ryu-online-test

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Validate Existing Archive
        run: |
          if [ -f RYU-ONLINE-SEARCH-INITIAL.zip ]; then
            ARCHIVE="RYU-ONLINE-SEARCH-INITIAL.zip"
          elif [ -f ryu-fixed.zip ]; then
            ARCHIVE="ryu-fixed.zip"
          elif [ -f ryu.zip ]; then
            ARCHIVE="ryu.zip"
          else
            echo "ZIP RYU tidak ditemukan!"
            exit 1
          fi

          unzip -t "$ARCHIVE"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Select Flutter Project
        run: |
          if [ -f pubspec.yaml ] && [ -f lib/main.dart ]; then
            PROJECT_DIR="."
          else
            mkdir -p extracted
            unzip -q "$ARCHIVE" -d extracted
            PROJECT_DIR=$(find extracted -name pubspec.yaml -printf '%h\n' | head -n 1)
          fi

          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Restore Gradle Wrapper
        run: |
          cd "$PROJECT_DIR"

          if [ ! -s android/gradlew ] || [ ! -s android/gradle/wrapper/gradle-wrapper.jar ]; then
            flutter create \
              --platforms=android \
              --project-name=ryu_wrapper_temp \
              /tmp/ryu_wrapper_temp

            mkdir -p android/gradle/wrapper

            cp /tmp/ryu_wrapper_temp/android/gradlew android/gradlew
            cp /tmp/ryu_wrapper_temp/android/gradle/wrapper/gradle-wrapper.jar \
              android/gradle/wrapper/gradle-wrapper.jar

            chmod +x android/gradlew
          fi

      - name: Configure Android Gradle
        run: |
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          content = settings.read_text()

          content, count = re.subn(
              r'(id\("com\.android\.application"\)\s+version\s+")[^"]+(")',
              r'\g<1>8.5.2\g<2>',
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("Versi Android Gradle Plugin tidak ditemukan.")

          settings.write_text(content)

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          content = wrapper.read_text()

          content, count = re.subn(
              r'^distributionUrl=.*$',
              r'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip',
              content,
              count=1,
              flags=re.MULTILINE
          )

          if count != 1:
              raise SystemExit("Gradle wrapper distributionUrl tidak ditemukan.")

          wrapper.write_text(content)

          print("AGP 8.5.2 dan Gradle 8.7 siap.")
          PY

      - name: Set Online Navigation Label
        run: |
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/features/shell/app_shell.dart")
          s = p.read_text()

          old = "_Tab('Search', Icons.search_rounded, Icons.search_rounded),"
          new = "_Tab('Online', Icons.language_rounded, Icons.language_rounded),"

          if new in s:
              print("Menu Online sudah tersedia.")
          elif old in s:
              p.write_text(s.replace(old, new, 1))
              print("Menu berhasil diubah menjadi Online.")
          else:
              raise SystemExit("Baris menu Search tidak ditemukan.")
          PY

      - name: Validate Project Files
        run: |
          cd "$PROJECT_DIR"

          test -s pubspec.yaml
          test -s lib/main.dart
          test -s android/settings.gradle.kts
          test -s android/app/build.gradle.kts
          test -s android/gradle/wrapper/gradle-wrapper.jar

      - name: Clean and Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter clean
          flutter pub get

      - name: Analyze Code
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos

      - name: Run Tests
        run: |
          cd "$PROJECT_DIR"
          flutter test

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RYU-ONLINE-BUILD-FLUTTER-329
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
