name: RYU Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RYU APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Select and Validate Project Archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f ryu-fixed.zip ]]; then
            ARCHIVE="ryu-fixed.zip"
          elif [[ -f ryu.zip ]]; then
            ARCHIVE="ryu.zip"
          else
            echo "::error::ZIP proyek tidak ditemukan."
            ls -la
            exit 1
          fi

          echo "Menggunakan: $ARCHIVE"
          unzip -t "$ARCHIVE"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Extract Flutter Project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -oq "${{ steps.archive.outputs.archive }}" -d extracted

          PROJECT_DIR="$(find extracted -type f -name pubspec.yaml -not -path '*/.dart_tool/*' -print -quit | xargs -r dirname)"

          if [[ -z "$PROJECT_DIR" || ! -f "$PROJECT_DIR/pubspec.yaml" ]]; then
            echo "::error::pubspec.yaml tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Validate Project Files
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          for file in pubspec.yaml lib/main.dart android/gradlew android/gradle/wrapper/gradle-wrapper.properties; do
            test -f "$file" || {
              echo "::error::File tidak ditemukan: $file"
              exit 1
            }
            echo "[OK] $file"
          done

      - name: Repair Gradle Wrapper if Needed
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [[ ! -s android/gradle/wrapper/gradle-wrapper.jar ]]; then
            flutter create --platforms=android --project-name=ryu_wrapper_temp /tmp/ryu_wrapper_temp
            mkdir -p android/gradle/wrapper
            cp /tmp/ryu_wrapper_temp/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          fi

          chmod +x android/gradlew
          cd android
          ./gradlew --version

      - name: Clean and Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter clean
          flutter pub get

      - name: Analyze Code
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos

      - name: Run Tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter test

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare APK Artifact
        shell: bash
        run: |
          set -euo pipefail
          cp "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk" RYU-RELEASE.apk
          ls -lh RYU-RELEASE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RYU-RELEASE
          path: RYU-RELEASE.apk
          if-no-files-found: error
          retention-days: 30
