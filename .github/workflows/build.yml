name: Build RYU APK

on:
  push:
    branches:
      - main
      - ryu-online-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RYU APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ryu-online-test

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: Validate Existing Archive
        run: |
          if [ -f RYU-ONLINE-SEARCH-INITIAL.zip ]; then
            ARCHIVE="RYU-ONLINE-SEARCH-INITIAL.zip"
          elif [ -f ryu-fixed.zip ]; then
            ARCHIVE="ryu-fixed.zip"
          elif [ -f ryu.zip ]; then
            ARCHIVE="ryu.zip"
          else
            echo "ZIP RYU tidak ditemukan!"
            exit 1
          fi

          unzip -t "$ARCHIVE"

      - name: Select Flutter Project
        run: |
          if [ -f pubspec.yaml ] && [ -f lib/main.dart ]; then
            PROJECT_DIR="."
          else
            mkdir -p extracted
            unzip -q "$ARCHIVE" -d extracted
            PROJECT_DIR=$(find extracted -name pubspec.yaml -printf '%h\n' | head -n 1)
          fi

          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure Android Gradle
        run: |
          cd "$PROJECT_DIR"

          sed -i 's/version "9.1.1"/version "8.5.2"/' \
            android/settings.gradle.kts

          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip#' \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "Android Gradle Plugin:"
          grep 'com.android.application' android/settings.gradle.kts

          echo "Gradle:"
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Set Online Navigation Label
        run: |
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/features/shell/app_shell.dart")
          s = p.read_text()

          old = "_Tab('Search', Icons.search_rounded, Icons.search_rounded),"
          new = "_Tab('Online', Icons.language_rounded, Icons.language_rounded),"

          if new in s:
              print("Online sudah tersedia.")
          elif old in s:
              p.write_text(s.replace(old, new, 1))
              print("Menu diubah menjadi Online.")
          else:
              raise SystemExit("Baris menu Search tidak ditemukan.")
          PY

      - name: Restore Gradle Wrapper
        run: |
          cd "$PROJECT_DIR"

          if [ ! -s android/gradlew ] || [ ! -s android/gradle/wrapper/gradle-wrapper.jar ]; then
            flutter create \
              --platforms=android \
              --project-name=ryu_wrapper_temp \
              /tmp/ryu_wrapper_temp

            mkdir -p android/gradle/wrapper
            cp /tmp/ryu_wrapper_temp/android/gradlew android/gradlew
            cp /tmp/ryu_wrapper_temp/android/gradle/wrapper/gradle-wrapper.jar \
              android/gradle/wrapper/gradle-wrapper.jar

            chmod +x android/gradlew
          fi

      - name: Validate Project Files
        run: |
          cd "$PROJECT_DIR"

          test -s pubspec.yaml
          test -s lib/main.dart
          test -s android/settings.gradle.kts
          test -s android/app/build.gradle.kts

      - name: Clean and Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter clean
          flutter pub get

      - name: Analyze Code
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos

      - name: Run Tests
        run: |
          cd "$PROJECT_DIR"
          flutter test

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release \
            --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RYU-ONLINE-NEW-BUILD
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
