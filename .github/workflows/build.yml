name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK (Flutter Stable / Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify toolchain versions
        run: |
          flutter --version
          java -version

      - name: Clean and fetch Flutter dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Ensure Gradle Wrapper JAR and executable permissions
        run: |
          mkdir -p android/gradle/wrapper
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            TMP_GW=$(mktemp -d)
            if command -v gradle >/dev/null 2>&1; then
              (cd "$TMP_GW" && gradle wrapper --gradle-version 8.7 --distribution-type all)
              cp "$TMP_GW/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            else
              flutter create "$TMP_GW/app" --platforms=android >/dev/null
              cp "$TMP_GW/app/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            fi
            rm -rf "$TMP_GW"
          fi
          chmod +x android/gradlew
          (cd android && ./gradlew --version)

      - name: Run Flutter static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter unit and widget tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Verify APK output
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Release APK was not generated or is empty at $APK_PATH"
            exit 1
          fi
          cp "$APK_PATH" RYU-RELEASE.apk
          ls -lh RYU-RELEASE.apk

      - name: Upload RYU-RELEASE.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: RYU-RELEASE-apk
          path: RYU-RELEASE.apk
          if-no-files-found: error
          retention-days: 30
