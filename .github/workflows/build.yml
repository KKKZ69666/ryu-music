
name: Build RYU APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract source
        run: |
          mkdir -p extracted
          unzip -o ryu.zip -d extracted
          PROJECT_FILE=$(find extracted -type f -name pubspec.yaml -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "pubspec.yaml tidak ditemukan!"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Check Gradle configuration
        run: |
          echo "=== Gradle JVM arguments ==="
          find "$PROJECT_DIR" -name gradle.properties -type f \
            -exec grep -n 'org.gradle.jvmargs' {} \; || true

      - name: Clean Gradle configuration
        run: |
          find "$PROJECT_DIR" -name gradle.properties -type f \
            -exec sed -i 's/"-Xmx/-Xmx/g; s/64m"/64m/g' {} +

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Analyze
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RYU-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
