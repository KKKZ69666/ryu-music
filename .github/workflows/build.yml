name: Build RYU APK

on:
  push:
    branches:
      - ryu-final-v2
    paths:
      - 'RYU-FINAL.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RYU APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Validate Archive
        run: |
          test -s RYU-FINAL.zip
          unzip -t RYU-FINAL.zip

      - name: Extract Flutter Project
        run: |
          mkdir -p extracted
          unzip -q RYU-FINAL.zip -d extracted

          PROJECT_DIR=$(find extracted -name pubspec.yaml -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "pubspec.yaml tidak ditemukan!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Validate Gradle Wrapper
        run: |
          cd "$PROJECT_DIR"
          test -s android/gradlew
          test -s android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Analyze Code
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos

      - name: Run Tests
        run: |
          cd "$PROJECT_DIR"
          flutter test

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RYU-RELEASE
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
