
name: Build RYU APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract RYU source
        run: |
          mkdir -p extracted
          unzip -o ryu.zip -d extracted

          PROJECT_FILE=$(find extracted -type f -name pubspec.yaml -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan!"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Diagnose Gradle configuration
        run: |
          echo "=== Gradle properties ==="
          find "$PROJECT_DIR" -name gradle.properties -type f \
            -exec grep -n 'org.gradle.jvmargs' {} \; || true

          echo "=== Java environment ==="
          env | grep -E 'JAVA_OPTS|GRADLE_OPTS|JAVA_TOOL_OPTIONS' || true

      - name: Fix Gradle JVM arguments
        run: |
          find "$PROJECT_DIR" -name gradle.properties -type f -exec sed -i \
            's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8|' {} +

          unset JAVA_OPTS
          unset GRADLE_OPTS
          unset JAVA_TOOL_OPTIONS

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter clean
          flutter pub get

      - name: Analyze project
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RYU-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
