
name: RYU Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RYU APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Extract RYU ZIP
        run: |
          echo "Extracting RYU..."
          unzip -o ryu.zip -d extracted
          echo "Searching Flutter project..."
          PROJECT_DIR=$(find extracted -name pubspec.yaml -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found in ZIP"
            exit 1
          fi

          echo "Project found: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Project
        run: |
          test -f "$PROJECT_DIR/pubspec.yaml"
          test -f "$PROJECT_DIR/android/settings.gradle.kts"
          test -f "$PROJECT_DIR/lib/main.dart"
          echo "RYU project OK"

      - name: Prepare Gradle
        run: chmod +x "$PROJECT_DIR/android/gradlew"

      - name: Install Dependencies
        working-directory: .
        run: cd "$PROJECT_DIR" && flutter pub get

      - name: Analyze Code
        run: cd "$PROJECT_DIR" && flutter analyze --no-fatal-infos

      - name: Run Tests
        run: cd "$PROJECT_DIR" && flutter test

      - name: Build Release APK
        run: cd "$PROJECT_DIR" && flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RYU-Android-APK
          path: extracted/**/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
