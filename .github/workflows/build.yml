
name: RYU Android APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build RYU
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract RYU
        run: |
          mkdir -p extracted
          unzip -o ryu.zip -d extracted

          PROJECT_FILE=$(find extracted -type f -name pubspec.yaml -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Check Environment
        run: |
          java -version
          flutter --version
          echo "Project: $PROJECT_DIR"

      - name: Inspect Gradle Configuration
        run: |
          echo "=== Gradle properties ==="
          find "$PROJECT_DIR" -name gradle.properties -type f \
            -exec grep -n 'org.gradle.jvmargs' {} \; || true

          echo "=== Gradle wrapper ==="
          find "$PROJECT_DIR/android" -name gradle-wrapper.properties \
            -type f -exec cat {} \; || true

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter clean
          flutter pub get

      - name: Analyze Flutter
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos

      - name: Build Release APK
        env:
          JAVA_OPTS: ""
          GRADLE_OPTS: ""
          JAVA_TOOL_OPTIONS: ""
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RYU-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
