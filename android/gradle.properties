org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# Flutter 3.50 + AGP 9: plugins used by RYU (just_audio, audio_service,
# permission_handler, ...) still apply the Kotlin Gradle Plugin themselves,
# so built-in Kotlin and the new AGP DSL stay off until they are migrated.
android.builtInKotlin=false
android.newDsl=false
